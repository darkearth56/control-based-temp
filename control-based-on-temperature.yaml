blueprint:
  name: Automatic Device Control based on Temperature
  author: darkearth56
  description: |
    ## Device on/off automation based on inside and outside temperature

    **Version 1.3.1** — see [CHANGELOG](https://github.com/darkearth56/control-based-temp/blob/main/CHANGELOG.md)

    The device turns on when the outside temperature is at or below your outside temperature limit and either:
    - the inside temperature is at or below your inside threshold, or
    - (optional) the inside temperature is within the dew point margin of the inside dew point, so it is at risk of condensation

    The device turns off when the inside temperature reaches your inside threshold plus the hysteresis value, and (if dew point is used) is at least the dew point margin plus 1 °C above the inside dew point.

    Dew point protection is optional: pick an inside humidity sensor to turn it on. The dew point is calculated from the inside temperature and humidity (Magnus formula). Leave the humidity sensor empty and the blueprint works on temperature only, as before.

    This also covers manual control: if you turn the device on by hand while the inside temperature is at or above that level, it will be turned off at the next temperature reading. Adjust the values to suit your needs.

    After switching, the automation waits for the confirm delay and checks the device actually changed. If it didn't (for example a cloud-controlled socket that missed the command), the command is sent once more. Set the delay to 0 to turn this off.

    If either temperature sensor is unavailable, nothing is switched until it reports a number again.

    What you need:
    - a switch, fan, light or input_boolean entity for the device (a smart plug, for example)
    - temperature sensor entities for inside and outside
    - optionally, a humidity sensor inside for dew point protection

    Based on [Automatic Fan Control based on Presence and Temperature](https://community.home-assistant.io/t/automatic-fan-control-based-on-presence-and-temperature/310398) by Sam04, and on [Automatic Temperature Fan Control](https://community.home-assistant.io/t/automatic-temperature-fan-control/350172) by fabiosoft, his temperature-only version of it.
  domain: automation
  source_url: https://github.com/darkearth56/control-based-temp/blob/main/control-based-on-temperature.yaml
  homeassistant:
    min_version: 2024.8.0
  input:
    fan:
      name: Device
      description: Device to control, for example the smart plug a heater is plugged into.
      selector:
        target:
          entity:
            domain:
              - switch
              - fan
              - light
              - input_boolean
    temp_inside:
      name: Temperature Inside
      description: Inside temperature sensor to track.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    temp_outside:
      name: Temperature Outside
      description: Outside temperature sensor, used to stop the device turning on
        when it is warm outside. Select the inside sensor here too if you don't want to use it.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    temp_outside_min:
      name: Outside temperature limit
      description: The device will not turn on when the outside temperature is above
        this value. Set it high (for example 50 °C) if you don't want an outside limit.
      selector:
        number:
          min: -30.0
          max: 50.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    temp_threshold_inside:
      name: Inside temperature threshold
      description: The device turns on when the inside temperature is at or below
        this value.
      selector:
        number:
          min: -10.0
          max: 40.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    hysteresis:
      name: Hysteresis
      description: How far the inside temperature must rise above the threshold before
        the device is turned off.
      selector:
        number:
          min: 0.5
          max: 10.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    humidity_inside:
      name: Humidity Inside (optional)
      description: Inside humidity sensor, used to work out the inside dew point. The
        device then also turns on when the inside temperature gets close to the dew
        point, to stop condensation. Leave empty to use temperature only.
      default: ''
      selector:
        entity:
          domain: sensor
          device_class: humidity
    dewpoint_margin:
      name: Dew point margin
      description: Turn on when the inside temperature is within this many degrees of
        the inside dew point. Only used when a humidity sensor is selected.
      default: 1.5
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    confirm_delay:
      name: Confirm delay
      description: Seconds to wait after switching before checking the device really
        changed. If it hasn't, the command is sent once more. Useful for cloud-controlled
        sockets that are slow to switch or sometimes miss a command (an EcoFlow AC outlet
        takes about 20 s to turn off under load). Set to 0 to disable.
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: s
          mode: slider

variables:
  fan: !input fan
  temp_inside_entity: !input temp_inside
  temp_inside: '{{ states(temp_inside_entity) }}'
  temp_outside_entity: !input temp_outside
  temp_outside: '{{ states(temp_outside_entity) }}'
  temp_threshold_inside: !input temp_threshold_inside
  temp_outside_min: !input temp_outside_min
  hysteresis: !input hysteresis
  confirm_delay: !input confirm_delay
  hum_entity: !input humidity_inside
  hum_inside: "{{ states(hum_entity) if hum_entity else 'unknown' }}"
  dewpoint_margin: !input dewpoint_margin
  dew_point: >-
    {% set t = temp_inside | float(none) %}
    {% set rh = hum_inside | float(none) %}
    {% if t is not none and rh is not none and 0 < rh <= 100 %}
      {% set g = log(rh / 100) + 17.62 * t / (243.12 + t) %}
      {{ (243.12 * g / (17.62 - g)) | round(2) }}
    {% else %}-999{% endif %}
  dew_ok: "{{ dew_point | float(-999) > -273 }}"
  fan_entities: >-
    {% set e = fan.entity_id if fan is mapping else fan %}
    {{ [e] if e is string else (e | list) }}

max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input temp_inside
  - platform: state
    entity_id: !input temp_outside

condition: []

action:
  - choose:
      - alias: Turn on when cold or near the dew point inside, and not too warm outside
        conditions:
          - alias: Inside temperature at or below threshold, or close to the inside dew point
            condition: template
            value_template: >-
              {{ temp_inside | float(none) is not none
                 and (temp_inside | float <= temp_threshold_inside | float
                      or (dew_ok and temp_inside | float <= dew_point | float + dewpoint_margin | float)) }}
          - alias: Outside temperature at or below limit
            condition: template
            value_template: >-
              {{ temp_outside | float(none) is not none
                 and temp_outside | float <= temp_outside_min | float }}
        sequence:
          - action: homeassistant.turn_on
            target: !input fan
          - alias: Confirm it turned on, retry once if not
            if:
              - condition: template
                value_template: '{{ confirm_delay | int(0) > 0 }}'
            then:
              - delay:
                  seconds: '{{ confirm_delay | int(0) }}'
              - if:
                  - condition: template
                    value_template: >-
                      {{ fan_entities | reject('is_state', 'on') | list | count > 0 }}
                then:
                  - action: homeassistant.turn_on
                    target: !input fan
      - alias: Turn off when inside reaches threshold plus hysteresis and is clear of the dew point
        conditions:
          - alias: Inside temperature at or above threshold plus hysteresis
            condition: template
            value_template: >-
              {{ temp_inside | float(none) is not none
                 and temp_inside | float >= (temp_threshold_inside | float + hysteresis | float) }}
          - alias: Inside temperature clear of the dew point (or dew point not used)
            condition: template
            value_template: >-
              {{ not dew_ok
                 or temp_inside | float >= dew_point | float + dewpoint_margin | float + 1 }}
        sequence:
          - action: homeassistant.turn_off
            target: !input fan
          - alias: Confirm it turned off, retry once if not
            if:
              - condition: template
                value_template: '{{ confirm_delay | int(0) > 0 }}'
            then:
              - delay:
                  seconds: '{{ confirm_delay | int(0) }}'
              - if:
                  - condition: template
                    value_template: >-
                      {{ fan_entities | select('is_state', 'on') | list | count > 0 }}
                then:
                  - action: homeassistant.turn_off
                    target: !input fan
    default: []

mode: single
