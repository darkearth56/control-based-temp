blueprint:
  name: Automatic Device Control based on Temperature
  description: "## Device ON/OFF Automation based on temperature, outside\
    \ temperature.\n\nDevice turns on if the following conditions are met:\n  temperature\
    \ inside lower than your set threshold value\n 
    \ temperature outside is higher than your set maximum value (to prevent turning\
    \ the devuce on)\n\nDevice turns on if the following conditions are met:\n\
    \ temperature inside is lower than your threshold value minus the hystersis value\n\
    \ manual\
    \ device control. Adapt the given values too your needs.\n  If you manually turn\
    \ the device on and the inside temperature is above the threshold your device will turn\
    \ off.\n\nWhat you need:\n  a device entity. if you control your device via a switch\
    \ entity (via smart plug for example) you can create a template device entity.\n\
    \  sensor entities for inside and outside temperature.\n"
  domain: automation
  input:
    fan:
      name: Fan
      description: Fan to control
      selector:
        target:
          entity:
            domain: fan
    temp_inside:
      name: Temperature Inside
      description: Temperature to track inside
      selector:
        entity:
          domain: sensor
          device_class: temperature
    temp_outside:
      name: Temperature Outside
      description: Temperature outside to prevent to turn on the fan for
        example. Set to same Temperature Inside entity if you don't want to use it
      selector:
        entity:
          domain: sensor
          device_class: temperature
    temp_outside_min:
      name: Outside temperature
      description: outside temperature to prevent device turn on (set to 
        to 0 to disable).
      selector:
        number:
          min: 0.0
          max: 300.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    temp_threshold_inside:
      name: Inside temperature threshold
      description: inside threshold temperature that must be reached to turn off the
        device
      selector:
        number:
          min: 0.0
          max: 300.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    hysteresis:
      name: Hysteresis
      description: The difference the observed value must be higher than the threshold
        value before the device is turned off
      selector:
        number:
          min: 0.5
          max: 100.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
  source_url: https://github.com/darkearth56/control-based-temp
variables:
  fan: !input 'fan'
  temp_inside_entity: !input 'temp_inside'
  temp_inside: '{{ states[temp_inside_entity].state }}'
  temp_outside_entity: !input 'temp_outside'
  temp_outside: '{{ states[temp_outside_entity].state }}'
  temp_threshold_inside: !input 'temp_threshold_inside'
  temp_outside_min: !input 'temp_outside_min'
  hysteresis: !input 'hysteresis'
max_exceeded: silent
trigger:
- platform: state
  entity_id: !input 'temp_inside'
- platform: state
  entity_id: !input 'temp_outside'
condition: []
action:
- choose:
  - conditions:
    - alias: temp inside greater than temp threshold value
      condition: template
      value_template: '{{ temp_inside|float < temp_threshold_inside|float }}

        '
    - alias: temp outside greater than outside min temp
      condition: template
      value_template: '{{ temp_outside|float < temp_outside_min|float }}

        '
    sequence:
    - service: homeassistant.turn_on
      target: !input 'fan'
  - conditions:
    - condition: or
      conditions:
      - condition: template
        value_template: '{{ (temp_threshold_inside - hysteresis)|float < temp_inside|float
          }}

          '
    sequence:
    - service: homeassistant.turn_off
      target: !input 'fan'
  default: []
mode: single
